<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Capability Console{% endblock %}</title>
<style>
  :root {
    --bg:#0f1216; --panel:#171b21; --panel2:#1d222a; --line:#2a313b;
    --ink:#e6eaf0; --dim:#8b95a5; --accent:#5b9dff;
    --ok:#3fb950; --warn:#d29922; --bad:#f85149; --info:#a371f7;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  header { display:flex; align-items:baseline; gap:16px; padding:14px 22px;
           background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; letter-spacing:.3px; }
  header .sub { color:var(--dim); font-size:12px; }
  header nav { margin-left:auto; display:flex; gap:16px; font-size:13px; }
  main { max-width:1180px; margin:0 auto; padding:22px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.9px;
       color:var(--dim); font-weight:600; margin:26px 0 12px; }
  h2:first-child { margin-top:0; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; }
  .pad { padding:16px 18px; }
  .grid { display:grid; gap:14px; align-items:start;
          grid-template-columns:repeat(auto-fit,minmax(430px,1fr)); }
  .mono { font-family:var(--mono); }
  .dim { color:var(--dim); }
  .badge { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px;
           font-weight:600; border:1px solid currentColor; white-space:nowrap; }
  .b-ok{color:var(--ok)} .b-warn{color:var(--warn)} .b-bad{color:var(--bad)}
  .b-info{color:var(--info)} .b-dim{color:var(--dim)}
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-weight:600; color:var(--dim); font-size:11px;
       text-transform:uppercase; letter-spacing:.6px;
       padding:8px 10px; border-bottom:1px solid var(--line); }
  td { padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:last-child td { border-bottom:none; }
  label { display:block; font-size:11px; color:var(--dim); margin:9px 0 3px;
          text-transform:uppercase; letter-spacing:.5px; }
  input[type=text], input[type=password], select {
    width:100%; padding:6px 9px; background:var(--panel2); color:var(--ink);
    border:1px solid var(--line); border-radius:5px; font-family:var(--mono); font-size:13px; }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  button { padding:7px 15px; border-radius:6px; border:1px solid var(--accent);
           background:var(--accent); color:#08101c; font-weight:600; font-size:13px;
           cursor:pointer; font-family:inherit; }
  button:hover { filter:brightness(1.1); }
  button.ghost { background:transparent; color:var(--ink); border-color:var(--line); }
  button.danger { background:transparent; color:var(--bad); border-color:var(--bad); }
  button:disabled { opacity:.45; cursor:not-allowed; filter:none; }
  pre { margin:0; font-family:var(--mono); font-size:12px; white-space:pre-wrap;
        word-break:break-word; }
  .note { border-left:3px solid var(--warn); background:var(--panel2);
          padding:11px 14px; border-radius:0 6px 6px 0; font-size:13px; }
  .cols { display:grid; grid-template-columns:170px 1fr; gap:5px 14px; font-size:13px; }
  .cols dt { color:var(--dim); }
  .cols dd { margin:0; font-family:var(--mono); word-break:break-word; }
</style>
</head>
<body>
<header>
  <h1>Capability Console</h1>
  <span class="sub">recorded UI capabilities &middot; deterministic replay &middot; no model in the loop</span>
  <nav>
    <a href="/ui">Capabilities</a>
    <a href="/ui/chat">Chat</a>
    <a href="/ui/runs">Runs</a>
    <a href="/docs">API</a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<script>
  const BADGE = {
    success:"b-ok", failed:"b-bad", business_outcome:"b-info",
    awaiting_operator:"b-warn", running:"b-warn", queued:"b-dim", rejected:"b-bad",
  };
  function badge(s) {
    return '<span class="badge ' + (BADGE[s] || "b-dim") + '">' + s + "</span>";
  }
  function esc(v) {
    return String(v === null || v === undefined ? "" : v)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
</script>
{% block scripts %}{% endblock %}
</body>
</html>

<html>
<head><title>Open Sub-Account</title></head>
<body bgcolor="#ffffff" topmargin="0" leftmargin="0">
<table width="100%" border="0" cellpadding="0" cellspacing="0">
<tr><td bgcolor="#808080" height="22">
  <font face="Arial" size="2" color="#ffffff"><b>&nbsp;OPEN SUB-ACCOUNT</b></font>
</td></tr>
</table>

<table border="0" cellpadding="6">
<tr><td><font face="Arial" size="2">
  Member <b>{{ member.member_id }}</b> &#8212; {{ member.name }}
</font></td></tr>
</table>

{% if error %}
<table border="0" cellpadding="6" cellspacing="0" width="98%" bgcolor="#ffdddd">
<tr><td>
  <font face="Arial" size="2" color="#aa0000"><b>VALIDATION ERROR</b> &#8212; {{ error }}</font>
</td></tr>
</table>
{% endif %}

<form method="post" action="/frame/subaccount/{{ member.member_id }}">
<table border="0" cellpadding="6" cellspacing="0">
  <tr>
    <td><font face="Arial" size="2">Product Type</font></td>
    <td>
      <select name="f1">
        <option value=""></option>
        <option value="Savings" {% if form.get('f1') == 'Savings' %}selected{% endif %}>Savings</option>
        <option value="Checking" {% if form.get('f1') == 'Checking' %}selected{% endif %}>Checking</option>
        <option value="Holiday" {% if form.get('f1') == 'Holiday' %}selected{% endif %}>Holiday Club</option>
      </select>
    </td>
  </tr>
  <tr>
    <td><font face="Arial" size="2">Opening Deposit</font></td>
    <td><input type="text" name="f2" size="12" value="{{ form.get('f2', '') }}"></td>
  </tr>
  <tr>
    <td><font face="Arial" size="2">Nickname</font></td>
    <td><input type="text" name="f3" size="24" value="{{ form.get('f3', '') }}"></td>
  </tr>
  <tr>
    <td></td>
    <td><input type="submit" value="Submit Request"></td>
  </tr>
</table>
</form>

</body>
</html>

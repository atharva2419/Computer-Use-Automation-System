<html>
<head><title>MERIDIAN CORE :: Sign On</title></head>
<body bgcolor="#c0c0c0">
<table width="100%" border="0" cellpadding="0" cellspacing="0">
<tr><td bgcolor="#000080" height="26">
  <font face="Arial" size="2" color="#ffffff"><b>&nbsp;MERIDIAN CORE &#8212; MEMBER SERVICING CONSOLE&nbsp; (r7.4.1)</b></font>
</td></tr>
</table>

<br><br>

<table align="center" border="1" cellpadding="0" cellspacing="0" bgcolor="#d4d0c8">
<tr><td>
  <table border="0" cellpadding="6" cellspacing="0" width="380">
  <tr><td colspan="2" bgcolor="#808080">
    <font face="Arial" size="2" color="#ffffff"><b>OPERATOR SIGN ON</b></font>
  </td></tr>

  {% if error %}
  <tr><td colspan="2">
    <table border="0" cellpadding="4" cellspacing="0" width="100%" bgcolor="#ffdddd">
    <tr><td><font face="Arial" size="2" color="#aa0000"><b>{{ error }}</b></font></td></tr>
    </table>
  </td></tr>
  {% endif %}

  <tr><td colspan="2">
    <form method="post" action="/login">
    <table border="0" cellpadding="4" cellspacing="0">
      <tr>
        <td align="right"><font face="Arial" size="2">Operator ID</font></td>
        <td><input type="text" name="f1" size="24"></td>
      </tr>
      <tr>
        <td align="right"><font face="Arial" size="2">Passphrase</font></td>
        <td><input type="password" name="f2" size="24"></td>
      </tr>
      <tr>
        <td></td>
        <td><input type="submit" value="Sign On"></td>
      </tr>
    </table>
    </form>
  </td></tr>
  </table>
</td></tr>
</table>

<br>
<table align="center" border="0" cellpadding="4">
<tr><td><font face="Arial" size="1" color="#404040">
  Demo environment. Synthetic data only. Operator <b>op.demo</b> / <b>demo-pass</b>.
</font></td></tr>
</table>

</body>
</html>
